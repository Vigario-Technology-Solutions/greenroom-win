# git-cliff -- CHANGELOG.md is generated from commit subjects, never hand-written.
#
# main is squash-only-or-rebase with `squash_merge_commit_title=PR_TITLE` and
# `squash_merge_commit_message=BLANK`, so a commit on main is a single
# conventional-commit subject and nothing else. That is the entire input here:
# there are no bodies to parse, no stacked footers, no merge commits to skip.
#
# Regenerate with `just changelog` (unreleased) or `just changelog-release`
# (through the latest tag). Never edit CHANGELOG.md by hand -- it is build output,
# and the way to change a changelog line is to change the PR title that produced
# it, before the merge.

[changelog]
# Kept byte-identical to the top of CHANGELOG.md so regeneration does not fight
# the committed file.
header = """
# Changelog

Generated from squash-merge subjects. Do not edit by hand.

"""

body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}- {{ commit.message | upper_first }}
{% endfor %}{% endfor %}"""

footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true

# Non-conforming subjects are dropped rather than dumped in raw. That is a real
# hole, and it is closed elsewhere on purpose: commitlint runs on pushes to main
# purely as a notification, so a subject that would be silently swallowed here
# names itself instead. See .github/workflows/main-subject.yml.
filter_unconventional = true

# A breaking change is reported even when its type would otherwise be skipped --
# a `chore!:` that removes a flag must not vanish from the changelog.
protect_breaking_commits = true

filter_commits = false
split_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Group names match the Keep a Changelog vocabulary already in CHANGELOG.md.
# Types that describe how the repository is maintained rather than what a user
# receives are skipped: a release note listing its own CI changes is noise to the
# only audience that reads it.
commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^perf",     group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert",   group = "Removed" },
  { message = "^docs",     skip = true },
  { message = "^test",     skip = true },
  { message = "^ci",       skip = true },
  { message = "^build",    skip = true },
  { message = "^chore",    skip = true },
]
