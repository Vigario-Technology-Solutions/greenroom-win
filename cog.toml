# cocogitto -- commit linting, changelog generation, version bumping and tagging.
#
# ONE TOOL, on purpose. The alternative shape was a linter plus a separate changelog
# generator, and those two can disagree: a commit whose summary wraps onto a second line
# is accepted by one and silently dropped by the other, so a change vanishes from the
# release notes behind nothing but a warning. A tool that lints with the same parser it
# generates from cannot disagree with itself, and that whole class of hole closes by
# construction -- which is why this file exists before anything releases from it.
#
#   cog verify "<subject>"   lints one message   -- CI runs it on the pull request title
#   cog check                lints history       -- CI runs it on pushes to main
#
#   cog bump                 version, changelog, commit and tag, in one step
#
# `cog check` walks history. Merge commits are not authored to a convention and never
# reach main here anyway -- the ruleset allows squash only -- so they are noise rather
# than findings.
ignore_merge_commits = true

# `v` marks a git REF, not a version. The tag carries it and ModuleVersion does not --
# semver says `v1.2.3` is not a semantic version, and PowerShell's ModuleVersion is
# [Version]-typed and could not hold a prefix if it wanted to.
tag_prefix = "v"

# Bumping from anywhere else would tag a commit that is not on the released line.
# Measured: `cog bump` on another branch refuses with "No patterns matched in [main]".
branch_whitelist = ["main"]

# THE VERSION LIVES IN THE SOURCE. ModuleVersion in the manifest is the only version slot
# in this repository -- there is no VERSION file, deliberately, because two slots are what
# drift. Update-ModuleManifest is PowerShell's own writer for it, so nothing here
# hand-edits a manifest.
#
# Verified before adopting it: it rewrites ModuleVersion, leaves the manifest valid, and
# preserves the exports and FormatsToProcess. It does restyle FunctionsToExport and Tags,
# which is 13 lines of diff churn on the first bump and stable afterwards.
#
# The staged `git add` matters: cog builds the bump commit from the index, so a hook that
# edits a file without staging it leaves the change out of the release commit.
pre_bump_hooks = [
    'pwsh -NoProfile -Command "Update-ModuleManifest -Path ./Greenroom/Greenroom.psd1 -ModuleVersion {{version}}"',
    'git add Greenroom/Greenroom.psd1',
]

# The branch and the tag are separate refs and separate pushes. The tag is what a release
# IS; the branch push is what carries the changelog and the bumped manifest back to main.
#
# `v{{version}}`, NOT `{{version}}`, and the `v` is not decoration. `{{version}}` expands
# to the VERSION, which is bare, while the thing being pushed is a REF, which carries the
# prefix. Getting it wrong is silent: `git push origin 0.2.0` pushes nothing, the tag stays
# on the runner, and the release exists nowhere.
#
# Both halves were measured rather than inferred from each other, because the two surfaces
# read differently: `cog bump --dry-run` prints the prefixed `v0.2.0` (it is telling you
# the tag) while the hook template gives the bare `0.2.0` (it is giving you the version).
post_bump_hooks = [
    'git push origin main',
    'git push origin v{{version}}',
]

[changelog]
path = "CHANGELOG.md"
# `remote` renders commit and author links against the repository rather than bare hashes,
# which is the difference between a changelog you can click and one you cannot.
template = "remote"
remote = "github.com"
owner = "Vigario-Technology-Solutions"
repository = "greenroom-win"

# PREPENDING IS A HARD REQUIREMENT and cocogitto does it natively, by looking for a literal
# `- - -` separator in CHANGELOG.md. Everything below that line is never touched again,
# which is what keeps 0.1.0 reading "Initial release." -- a first release has no changes to
# list, because there is nothing it changed from.
#
# Rehearsed end to end against a throwaway remote before landing: two releases in sequence,
# each prepending above the previous, with the hand-written 0.1.0 untouched underneath.

# CHANGELOG MAPPING, MATCHING THE ESTATE. A changelog has to read the same way in two
# repositories or the type stops meaning one thing, so this mirrors pipetree's
# `commit_parsers` exactly rather than choosing per repository: entries for `feat`, `fix`
# and `revert`, nothing for anything else. A repository may ADD a type its domain needs;
# it may not change what an existing one does to a release.
#
# `refactor` and `perf` are omitted for the reason the spec gives rather than by taste: a
# refactor is behaviour-preserving, so if it shipped something a user can see it was
# mis-typed and should have been feat or fix. perf is technically observable, and is
# treated the same because nothing here ships a perf-only release.
#
# `style` is configured despite not being in the Angular set, so that historical commits
# regenerate faithfully if the changelog is ever rebuilt from scratch.
[commit_types.refactor]
omit_from_changelog = true

[commit_types.perf]
omit_from_changelog = true

[commit_types.style]
omit_from_changelog = true

[commit_types.docs]
omit_from_changelog = true

[commit_types.test]
omit_from_changelog = true

[commit_types.ci]
omit_from_changelog = true

[commit_types.build]
omit_from_changelog = true

[commit_types.chore]
omit_from_changelog = true

# A revert ships a behaviour change from the user's side even though the commit undoes
# something, so it belongs with the fixes rather than in a section of its own.
[commit_types.revert]
changelog_title = "Bug Fixes"
