name: CI

# The gate. Runs `just check` and nothing else, so a green local run and a green pull
# request mean the same thing. If CI could fail where `just check` passes, the pull
# request becomes the only place a failure can be discovered.
#
# ONE job on purpose. This repository is private, so every job re-pays its own setup
# against billed minutes; a fan-out would buy a more precise red X and pay for it four
# times over. Public repositories in the estate fan out instead, where minutes are free.
#
# NO `paths:` filter, deliberately. A required check with a path filter simply never
# reports on a pull request that touches nothing it matches, and the branch wedges
# waiting for a check that will never arrive.
#
# The job below is named `ci` and that name IS the required-check context in
# .github/rulesets/main.json. It is deliberately tautological rather than descriptive:
# renaming a job does not fail loudly, it leaves the ruleset waiting on a context nothing
# will ever report, which is indistinguishable from one merely pending. A constant name
# means splitting or adding jobs later never touches protection. Should it ever need to
# change anyway: relax the rule, merge the rename, tighten it again, then verify.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also on main, so a break introduced by a rebase merge -- which replays branch
  # commits rather than the reviewed squash -- is reported rather than discovered by
  # the next person to clone.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # WINDOWS, and it costs 2x the minutes of a Linux runner on a private repository.
    # That is paid deliberately.
    #
    # This first ran on ubuntu-latest, on the reasoning that nothing in the gate
    # EXECUTES the scripts -- it parses them, analyses them, and the tests mock every
    # Windows call. That reasoning was wrong, and this workflow's own first run proved
    # it: 39 of 95 tests failed with "Could not find Command Get-ScheduledTask".
    #
    # Pester's Mock requires a command to EXIST before it can be mocked. The
    # ScheduledTasks cmdlets ship only on Windows, so on Linux there is nothing to
    # attach a mock to. Stubbing them would be faking the platform, and skipping those
    # tests would report green while silently dropping 40% of the suite -- which is
    # worse than either paying for Windows or not testing at all.
    #
    # The compensation is real: on Windows the suite exercises the actual cmdlets it
    # mocks, so the gate is closer to the platform it targets than the Linux version
    # could ever have been. It still does not prove a session starts -- that needs a
    # Claude Code login, and stays a manual measurement on the reference host.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # No history needed: every phase reads the working tree.
          fetch-depth: 1

      - uses: extractions/setup-just@v3

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-pester5-psscriptanalyzer

      # Provisioning is a NAMED STEP rather than something the gate does to a machine on
      # its way past. windows-latest ships both today, so this is usually a no-op; it is
      # here so that a runner image dropping one fails in a step called "dependencies"
      # instead of somewhere inside a check, and so the gate itself never installs
      # anything on a contributor's machine or silently moves the analyzer version it
      # enforces.
      - name: Ensure check dependencies
        shell: pwsh
        run: |
          $need = @{ PSScriptAnalyzer = '1.21.0'; Pester = '5.0.0' }
          foreach ($m in $need.GetEnumerator()) {
            if (Get-Module -ListAvailable $m.Key | Where-Object Version -ge ([version]$m.Value)) {
              Write-Host "$($m.Key) present"
            }
            else {
              Install-Module $m.Key -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion $m.Value
            }
          }

      - run: just check
        shell: pwsh
